<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <title id="titulo">Metadatos y sistema de diseño</title>
    <desc id="desc">Dos tarjetas conectadas por una flecha. La izquierda muestra el head de un documento HTML con sus metadatos. La derecha muestra variables CSS de color declaradas en root.</desc>

    <defs>
        <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#209ca0"/>
        </marker>
    </defs>

    <!-- Fondo -->
    <rect width="800" height="450" rx="18" fill="#101010"/>

    <!-- Tarjeta izquierda: metadatos del head -->
    <rect x="40" y="50" width="300" height="350" rx="14" fill="#101010" stroke="#209ca0" stroke-width="3"/>
    <rect x="40" y="50" width="300" height="46" rx="14" fill="#832396"/>
    <rect x="40" y="70" width="300" height="26" fill="#832396"/>
    <text x="62" y="81" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="bold" fill="#ffffff">&lt;head&gt;</text>

    <g font-family="ui-monospace, Consolas, monospace" font-size="17" fill="#209ca0">
        <text x="62" y="124">&lt;meta charset&gt;</text>
        <text x="62" y="150">&lt;meta viewport&gt;</text>
        <text x="62" y="176">&lt;title&gt;</text>
        <text x="62" y="202">&lt;meta description&gt;</text>
        <text x="62" y="228">&lt;meta robots&gt;</text>
        <text x="62" y="254">&lt;link stylesheet&gt;</text>
    </g>

    <line x1="62" y1="272" x2="318" y2="272" stroke="#832396" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="62" y="302" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="bold" fill="#ffffff">&lt;body&gt;</text>
    <rect x="62" y="316" width="200" height="12" rx="6" fill="#832396"/>
    <rect x="62" y="338" width="240" height="12" rx="6" fill="#832396"/>
    <rect x="62" y="360" width="160" height="12" rx="6" fill="#832396"/>

    <!-- Flecha -->
    <path d="M 352 225 L 428 225" stroke="#209ca0" stroke-width="4" fill="none" marker-end="url(#punta)"/>

    <!-- Tarjeta derecha: variables de :root -->
    <rect x="440" y="50" width="320" height="350" rx="14" fill="#101010" stroke="#832396" stroke-width="3"/>
    <rect x="440" y="50" width="320" height="46" rx="14" fill="#209ca0"/>
    <rect x="440" y="70" width="320" height="26" fill="#209ca0"/>
    <text x="462" y="81" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="bold" fill="#101010">:root</text>

    <!-- Muestras con los valores reales de las variables -->
    <circle cx="474" cy="124" r="13" fill="#101010" stroke="#ffffff" stroke-width="2"/>
    <circle cx="474" cy="166" r="13" fill="#832396"/>
    <circle cx="474" cy="208" r="13" fill="#0D4749" stroke="#ffffff" stroke-width="2"/>
    <circle cx="474" cy="250" r="13" fill="#FFFFFF"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="17" fill="#ffffff">
        <text x="504" y="130">--color-texto</text>
        <text x="504" y="172">--color-destacado</text>
        <text x="504" y="214">--color-acento</text>
        <text x="504" y="256">--color-fondo</text>
    </g>

    <line x1="462" y1="284" x2="738" y2="284" stroke="#209ca0" stroke-width="2" stroke-dasharray="6 6"/>

    <text x="462" y="316" font-family="ui-monospace, Consolas, monospace" font-size="17" fill="#209ca0">var(--color-destacado)</text>
    <rect x="462" y="330" width="200" height="44" rx="10" fill="#832396"/>
    <text x="562" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#ffffff">Botón</text>
</svg>
